name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax-check all tracked Python
        run: |
          files=$(git ls-files '*.py' | grep -v -E '\.venv/|site-packages/' || true)
          echo "$files"
          if [ -n "$files" ]; then python -m py_compile $files; fi

      - name: exploitgym-eval unit tests
        working-directory: exploitgym-eval
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python tests/test_aggregate.py

  license-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Self-test the license classifier
        run: python scripts/check_licenses.py --selftest

      - name: Install all project requirements
        run: |
          python -m pip install --upgrade pip
          for req in $(git ls-files '*requirements*.txt'); do
            echo "installing $req"
            pip install -r "$req"
          done

      - name: Dependency license gate (block strong copyleft)
        run: python scripts/check_licenses.py
