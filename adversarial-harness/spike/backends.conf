# Day-1 backend configuration — the reusable per-backend tool-call artifact.
# One OpenAI-compatible /v1/chat/completions endpoint per backend; the SAME tool
# schema (schema/run_shell.tool.json) round-trips through both. Selecting a backend
# is configuration only — that is the neutrality property (DESIGN.md §1.1, §4 L3).
#
# Keys are NOT stored here. They resolve at run time from the named *_KEY_VAR
# environment variable, which roundtrip.sh sources from the repo .env files
# (exploitgym-eval/.env, ttp-benchmark/.env). Never commit secrets.

# --- LOCAL: Ollama on the workstation, OpenAI-compatible surface, no GPU ---
LOCAL_BASE_URL="http://localhost:11434/v1"
LOCAL_MODEL="qwen3.6:latest"
LOCAL_KEY_VAR="OLLAMA_API_KEY"   # unused by Ollama; any/empty value is fine

# --- HOSTED: Fireworks, OpenAI-compatible surface (same request shape as local) ---
HOSTED_BASE_URL="https://api.fireworks.ai/inference/v1"
HOSTED_MODEL="accounts/fireworks/models/kimi-k3"
HOSTED_KEY_VAR="FIREWORKS_API_KEY"
